  - GK
  - DEF
  - MID
  - FWD
  min_minutes_for_rating: 900
text_sources:
  reddit:
    enabled: true
    season_window_only: true
    subreddits_league:
    - soccer
    - PremierLeague
    subreddits_clubs:
      Arsenal:
      - Gunners
      AstonVilla:
      - avfc
      Bournemouth:
      - AFCBournemouth
      Brentford:
      - Brentford
      Brighton:
      - BrightonHoveAlbion
      Burnley:
      - Burnley
      Chelsea:
      - chelseafc
      CrystalPalace:
      - crystalpalace
      Everton:
      - Everton
      Fulham:
      - fulhamfc
      LeedsUnited:
      - LeedsUnited
      Liverpool:
      - LiverpoolFC
      ManchesterCity:
      - MCFC
      ManchesterUnited:
      - reddevils
      NewcastleUnited:
      - NUFC
      NottinghamForest:
      - nffc
      Sunderland:
      - safc
      TottenhamHotspur:
      - coys
      WestHamUnited:
      - Hammers
      WolverhamptonWanderers:
      - WWFC
    max_texts_per_player: 60
    min_words: 8
    max_pages_per_query: 3
    max_threads_per_query: 3    # batas thread per (pemain x subreddit x istilah)
    rate_limit_seconds: 1.0     # lantai keras 1 detik, tidak bisa diturunkan
    cache_dir: "data/raw/reddit"

    # ------------------------------------------------------------ B3. Provider Apify
    # Jalur cadangan: actor pihak ketiga `automation-lab/reddit-scraper`.
    #
    # STATUS: NONAKTIF. Dinonaktifkan 2026-11-12 setelah ditinjau ulang.
    # Actor ini melanggar Reddit User Agreement §7 ("scraping ... without
    # Reddit's prior written consent is prohibited") dan PRD §13, sementara
    # AGENTS.md mewajibkan patuh ToS dan melarang jalan pintas saat akses
    # Reddit bermasalah. Jalur teks resmi: OAuth (bila disetujui) atau
    # YouTube + artikel (PRD §12).
    #
    # Kode dan pengalaman pilotnya tetap disimpan sebagai catatan, bukan
    # sebagai jalur yang dipakai. Jangan aktifkan tanpa keputusan tim yang
    # baru dan tertulis di docs/decisions.md.
    apify:
      enabled: false            # WAJIB false; lihat alasan di atas
      max_posts_per_player: 15
      max_comments_per_post: 12
      max_cost_usd: 4.0         # pagar biaya; tidak boleh melebihi sisa kredit Apify
      search_time_filter: "year"
      search_sort: "top"        # post paling dibahas setahun terakhir, bukan yang terbaru

    # ------------------------------------------------- Provider Arctic Shift (B4)
    # Arsip Reddit pihak ketiga. Dipakai untuk Tahap B karena OAuth tidak
    # tersedia (formulir Data API belum dikirim, kredensial kosong) dan Apify
    # ditolak. Keputusan tim tertulis di docs/decisions.md 2026-11-12.
    arctic_shift:
      enabled: true
      max_pages_per_term: 2         # 2 halaman x 100 komentar per (subreddit, term)
      limit_ladder: [100, 25]       # 422 pada limit besar turun ke limit kecil
      retry_gap_seconds: 10         # basis jeda; backoff exponential 10/20/40 s
      max_attempts: 4
      max_reset_wait_seconds: 120   # patuh header X-RateLimit-Reset, dengan pagar
      rate_limit_seconds: 1.0       # lantai keras, sama seperti jalur OAuth
      cache_dir: "data/raw/reddit/arctic/cache"

  youtube:
    enabled: true
    use_playlist_items: true
    max_texts_per_player: 40
    include_transcript: true
    min_words: 8
    rate_limit_seconds: 1.0     # lantai keras, sama seperti jalur Reddit
    # Pemain yang teks YouTube-nya teridentifikasi milik orang lain. Dikeluarkan
    # lewat config, bukan filter tersembunyi di kode, supaya alasannya ikut
    # tercatat di summary.json setiap run. Teks Reddit pemain ini tidak
    # terpengaruh.
    # Alasan lengkap: docs/tahap-b-youtube.md bagian "Keterbatasan".
    exclude_players:
    - player_id: fotmob_1174296
      name: André
      reason: >-
        22 dari 40 komentar yang cocok (55%) ternyata tentang Andre Silva, adik
        Diogo Jota yang meninggal, bukan Andre pemain Wolves. Alias satu kata
        "Andre" cocok sebagai awalan nama orang lain. Terdeteksi lewat gate
        relevansi PRD 11, bukan ditebak.
    # Handle dan ID diverifikasi 2026-11-12 lewat `channels.list?forHandle=`.
    # Wajib disimpan di sini, bukan di cache `data/raw/`, supaya anggota lain
    # bisa mereproduksi run dari clone bersih (data/raw gitignored).
    # Dua nama di bawah sengaja berbeda dari tebakan awal:
    #   @TifoFootball tidak ada; channelnya sekarang @TIFO (di bawah The Athletic)
    #   @SkySportsPL = kanal penggemar "TRS SkySports", bukan Sky Sports
    channels:
    - name: The Overlap
      handle: '@TheOverlap'
      channel_id: UCjXIw1GlwaY1IzpW_jN9iCQ
      uploads: UUjXIw1GlwaY1IzpW_jN9iCQ
    - name: Tifo Football
      handle: '@TIFO'
      channel_id: UCGYYNGmyhZ_kwBF_lqqXdAQ
      uploads: UUGYYNGmyhZ_kwBF_lqqXdAQ
    - name: The Athletic FC
      handle: '@TheAthleticFC'
      channel_id: UC6ZMmQaL9wZYo4iLw8n8xiA
      uploads: UU6ZMmQaL9wZYo4iLw8n8xiA
    - name: Sky Sports Premier League
      handle: '@SkySportsPremierLeague'
      channel_id: UCNAf1k0yIjyGu3k9BwAg3lg
      uploads: UUNAf1k0yIjyGu3k9BwAg3lg
    - name: Premier League
      handle: '@premierleague'
      channel_id: UCG5qGWdu8nIRZqJ_GgDwQ-w
      uploads: UUG5qGWdu8nIRZqJ_GgDwQ-w
