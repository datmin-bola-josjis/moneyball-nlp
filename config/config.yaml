project:
  name: pemain-undervalued-epl
  semester: SMT5
  course: Data Mining
league:
  code: EPL
  name: Premier League
  country: England
  season: 2025/26
  season_start: '2025-07-01'
  season_end: '2026-05-31'
  num_clubs: 20
  clubs:
  - Arsenal
  - Aston Villa
  - Bournemouth
  - Brentford
  - Brighton
  - Burnley
  - Chelsea
  - Crystal Palace
  - Everton
  - Fulham
  - Leeds United
  - Liverpool
  - Manchester City
  - Manchester United
  - Newcastle United
  - Nottingham Forest
  - Sunderland
  - Tottenham Hotspur
  - West Ham United
  - Wolverhampton Wanderers
  club_name_aliases:
    AFC Bournemouth: Bournemouth
    Brighton & Hove Albion: Brighton
population:
  min_minutes: 900
  price_filter_enabled: false
  price_percentile_max: null
  position_groups:
  - GK
  - DEF
  - MID
  - FWD
text_sample:
  target_players: 70
  per_position_group: 17
  min_per_cell: 4
  stratify_by: market_value_quartile
  random_seed: 20252026
  locked: true
  locked_at: '2026-11-12'
  locked_file: data/processed/text_sample.parquet
data_source:
  provider: fotmob
  league_id: 47
  season_id: 27110
  stats_endpoint: https://www.fotmob.com/api/data/leagueseasondeepstats
  market_value_from: playerData.marketValues
  position_map_note: numeric codes; map explicitly, verify before z-score
validation:
  rating_source: fotmob
  tiers:
  - GK
  - DEF
  - MID
  - FWD
  min_minutes_for_rating: 900
text_sources:
  reddit:
    enabled: true
    season_window_only: true
    subreddits_league:
    - soccer
    - PremierLeague
    subreddits_clubs:
      Arsenal:
      - Gunners
      AstonVilla:
      - avfc
      Bournemouth:
      - AFCBournemouth
      Brentford:
      - Brentford
      Brighton:
      - BrightonHoveAlbion
      Burnley:
      - Burnley
      Chelsea:
      - chelseafc
      CrystalPalace:
      - crystalpalace
      Everton:
      - Everton
      Fulham:
      - fulhamfc
      LeedsUnited:
      - LeedsUnited
      Liverpool:
      - LiverpoolFC
      ManchesterCity:
      - MCFC
      ManchesterUnited:
      - reddevils
      NewcastleUnited:
      - NUFC
      NottinghamForest:
      - nffc
      Sunderland:
      - safc
      TottenhamHotspur:
      - coys
      WestHamUnited:
      - Hammers
      WolverhamptonWanderers:
      - WWFC
    max_texts_per_player: 60
    min_words: 8
    max_pages_per_query: 3
    max_threads_per_query: 3    # batas thread per (pemain x subreddit x istilah)
    rate_limit_seconds: 1.0     # lantai keras 1 detik, tidak bisa diturunkan
    cache_dir: "data/raw/reddit"

    # ------------------------------------------------------------ B3. Provider Apify
    # Jalur cadangan: actor pihak ketiga `automation-lab/reddit-scraper`.
    #
    # STATUS: NONAKTIF. Dinonaktifkan 2026-11-12 setelah ditinjau ulang.
    # Actor ini melanggar Reddit User Agreement §7 ("scraping ... without
    # Reddit's prior written consent is prohibited") dan PRD §13, sementara
    # AGENTS.md mewajibkan patuh ToS dan melarang jalan pintas saat akses
    # Reddit bermasalah. Jalur teks resmi: OAuth (bila disetujui) atau
    # YouTube + artikel (PRD §12).
    #
    # Kode dan pengalaman pilotnya tetap disimpan sebagai catatan, bukan
    # sebagai jalur yang dipakai. Jangan aktifkan tanpa keputusan tim yang
    # baru dan tertulis di docs/decisions.md.
    apify:
      enabled: false            # WAJIB false; lihat alasan di atas
      max_posts_per_player: 15
      max_comments_per_post: 12
      max_cost_usd: 4.0         # pagar biaya; tidak boleh melebihi sisa kredit Apify
      search_time_filter: "year"
      search_sort: "top"        # post paling dibahas setahun terakhir, bukan yang terbaru

  youtube:
    enabled: true
    use_playlist_items: true
    max_texts_per_player: 40
    include_transcript: true
    min_words: 8
    channels:
    - name: The Overlap
    - name: Tifo Football
    - name: The Athletic FC
    - name: Sky Sports Premier League
    - name: Premier League
  article:
    enabled: false
    min_name_mentions: 3
    domains:
    - theathletic.com
    - fifa.com
    - whoscored.com
    - theguardian.com
    - bbc.co.uk
    respect_paywall: true
  twitter:
    enabled: false
retrieval:
  require_english: true
  dedupe_by:
  - text_clean_hash
  - url
  drop_bots: true
  per_summary_period_days: 14
